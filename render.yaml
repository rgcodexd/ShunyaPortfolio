services:
  # The Node.js Express Backend
  - type: web
    name: shunya-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # The Astro Frontend
  - type: web
    name: shunya-frontend
    env: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    # Assuming SSR or Node adapter is added later, for now we can serve static via standard server
    # If purely static, Render Static Site is better. Let's assume Node adapter for SSR features.
    startCommand: node ./dist/server/entry.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BACKEND_API_URL
        value: https://shunya-backend.onrender.com/api
